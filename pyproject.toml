[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-volrisk"
version = "0.1.0"
description = "NEXUS historical market data ingestion and quality controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "yfinance>=0.2.54,<2",
    "pyarrow>=15,<24",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
    "arch>=7,<8",
    "statsmodels>=0.14,<0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]
calendar = ["pypdf>=6,<7", "beautifulsoup4>=4.12,<5", "requests>=2.31,<3"]
ml = ["xgboost>=2,<4", "scikit-learn>=1.4,<2"]  # Install for the Stage 3 challenger

[project.scripts]
volrisk-ingest = "volrisk.cli:main"
volrisk-forecast = "volrisk.forecast_cli:main"
volrisk-intraday = "volrisk.intraday_cli:main"
volrisk-har = "volrisk.har_cli:main"
volrisk-stage4b = "volrisk.stage4b_cli:main"
volrisk-stage5 = "volrisk.stage5_cli:main"
volrisk-stage6 = "volrisk.stage6_cli:main"
volrisk-monitor = "volrisk.monitoring_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]
